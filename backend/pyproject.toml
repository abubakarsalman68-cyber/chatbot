[project]
name = "backend"
version = "0.1.0"
description = "OpenChat backend API"
readme = "README.md"
authors = [
    { name = "abubakarsalman68-cyber", email = "abubakarsalman68@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[project.scripts]
backend = "backend:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
